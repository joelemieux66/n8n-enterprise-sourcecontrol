name: Validate promotion

# One job, one runner. A promotion check that takes longer than the thing it is
# gating is a demo liability: dev -> staging used to spend ~66s across three
# sequential jobs (lint -> validate-n8n -> merge), each paying its own runner
# spin-up and checkout. That is a minute of dead air right when you are saying
# "watch, it merges itself."
#
# What it checks: changed workflow JSON parses and has the keys n8n requires.
# That is the failure mode worth catching on a promotion — a malformed file that
# would break the pull on the target instance.
#
# The old validate-n8n job (import each changed workflow into the live dev
# instance as a scratch draft) was continue-on-error, so it never actually
# gated anything — it just cost a runner and left scratch workflows on dev. It
# is in git history if you want it back.
#
# dev -> staging merges itself. staging -> main does not: a PR into main is a
# prod deploy, and a human owns that click.

on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validate-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint changed workflow JSON
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- 'workflows/*.json')

          if [ ${#files[@]} -eq 0 ]; then
            echo "No changed workflow JSON — nothing to lint."
            echo "No workflow changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Promotion check"
            echo ""
            echo "| workflow | nodes | result |"
            echo "|---|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for f in "${files[@]}"; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::not valid JSON"
              echo "| \`$f\` | — | invalid JSON |" >> "$GITHUB_STEP_SUMMARY"
              fail=1; continue
            fi
            if ! jq -e 'has("nodes") and has("connections")' "$f" >/dev/null; then
              echo "::error file=$f::missing required 'nodes' or 'connections' key"
              echo "| \`$f\` | — | missing nodes/connections |" >> "$GITHUB_STEP_SUMMARY"
              fail=1; continue
            fi
            name=$(jq -r '.name // "(unnamed)"' "$f")
            count=$(jq '[.nodes[]] | length' "$f")
            echo "  ok  $name ($count nodes)"
            echo "| $name | $count | ok |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $fail

      # dev -> staging only. A PR into main is a prod deploy; a person merges it.
      #
      # Merges with PROMOTE_TOKEN, not GITHUB_TOKEN. A push made with the
      # built-in token does not trigger workflows, so merging with it lands the
      # commit on staging and the staging -> main promotion never opens. The
      # chain silently stops one hop short.
      - name: Merge (dev -> staging only)
        if: github.base_ref == 'staging'
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.PROMOTE_TOKEN != '' }}
        run: |
          gh pr merge --merge --admin "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-merged into \`staging\`." >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_PAT" = "true" ]; then
            echo "The staging → main promotion will open on its own." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Merged with GITHUB_TOKEN, so this push will not trigger the staging → main promotion. Set PROMOTE_TOKEN."
            echo "Set \`PROMOTE_TOKEN\` — without it the chain stops here." >> "$GITHUB_STEP_SUMMARY"
          fi
