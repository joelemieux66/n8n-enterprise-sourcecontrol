name: Promote

# dev -> staging -> main, as a reviewable PR, opened automatically.
#
# A push to dev opens the dev -> staging PR. That PR auto-merges (see
# validate-promotion.yml), which is itself a push to staging, which opens the
# staging -> main PR. That one waits for a human. So the whole chain runs off a
# single push from dev, with exactly one manual gate: the merge into main.
#
# The PR body lists workflows by NAME, not by opaque ID, so the reviewer can
# actually tell what they are approving.
#
# This only opens PRs. Merging is what deploys: the promotion pipeline
# (workflows/VjZ8UMkT85Bp2mZX.json) receives GitHub's pull_request webhook and
# calls the target instance's source-control pull API. Nothing here pulls.
#
# Requires "Allow GitHub Actions to create and approve pull requests"
# (Settings -> Actions -> General). Without it every run fails with
# "GitHub Actions is not permitted to create or approve pull requests".

on:
  push:
    branches: [dev, staging]
    paths:
      - 'workflows/**'
      - 'credential_stubs/**'
      - 'datatables/**'
      - 'tags.json'
      - 'folders.json'
  workflow_dispatch:
    inputs:
      from:
        description: 'Source branch'
        required: true
        default: dev
        type: choice
        options: [dev, staging]
      to:
        description: 'Target branch'
        required: true
        default: staging
        type: choice
        options: [staging, main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the hop
        id: hop
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # The pushed branch determines the hop. Only dev and staging can
            # trigger, so there is no invalid combination to guard against.
            case "${{ github.ref_name }}" in
              dev)     from=dev;     to=staging ;;
              staging) from=staging; to=main    ;;
            esac
          else
            from="${{ inputs.from }}"
            to="${{ inputs.to }}"
            if [ "$from" = "$to" ]; then
              echo "::error::from and to are the same branch"; exit 1
            fi
            if [ "$from" = "dev" ] && [ "$to" = "main" ]; then
              echo "::error::dev cannot promote straight to main — go through staging"; exit 1
            fi
            if [ "$from" = "staging" ] && [ "$to" = "staging" ]; then
              echo "::error::invalid hop"; exit 1
            fi
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to"     >> "$GITHUB_OUTPUT"
          echo "Promoting $from -> $to"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build human-readable diff
        env:
          FROM: ${{ steps.hop.outputs.from }}
          TO: ${{ steps.hop.outputs.to }}
        run: |
          git diff --name-status "origin/$TO...origin/$FROM" -- workflows/ > changed.txt || true

          # Name the environment, not the branch. "the main instance" means
          # nothing to a reviewer; prod is the thing that pages someone.
          case "$TO" in
            main)    env_name=prod ;;
            staging) env_name=staging ;;
            *)       env_name="$TO" ;;
          esac

          : > body.md
          echo "Promoting \`$FROM\` → \`$TO\`." >> body.md
          echo "" >> body.md

          if [ ! -s changed.txt ]; then
            echo "No workflow changes to promote." >> body.md
          else
            echo "| change | workflow | id |" >> body.md
            echo "|---|---|---|" >> body.md
            while read -r status path; do
              [ -z "${path:-}" ] && continue
              id=$(basename "$path" .json)
              name=$(git show "origin/$FROM:$path" 2>/dev/null \
                     | python3 -c 'import json,sys;print(json.load(sys.stdin).get("name","?"))' 2>/dev/null || echo "(deleted)")
              case "$status" in
                A) label="added" ;;
                M) label="modified" ;;
                D) label="**deleted**" ;;
                *) label="$status" ;;
              esac
              echo "| $label | $name | \`$id\` |" >> body.md
            done < changed.txt
          fi

          echo "" >> body.md
          echo "Merging this fires the \`pull_request\` webhook, which triggers the pull on the **$env_name** instance." >> body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.hop.outputs.from }}
          TO: ${{ steps.hop.outputs.to }}
        run: |
          existing=$(gh pr list --base "$TO" --head "$FROM" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file body.md
            echo "Updated existing PR #$existing"
          else
            gh pr create \
              --base "$TO" --head "$FROM" \
              --title "Promote $FROM → $TO" \
              --body-file body.md
          fi
